<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="هاپو - چت‌بات هوشمند پاگ با شخصیت دوست‌داشتنی و پاسخ‌های علمی دقیق">
    <meta name="theme-color" content="#FF8C42">
    <title>هاپو 🐾 | چت‌بات هوشمند پاگ</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">

    <!-- Google Fonts: Vazirmatn for Persian -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main App Container -->
    <div id="app" class="app-container">

        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="logo-container">
                    <div class="logo-avatar">🐶</div>
                    <div class="logo-text">
                        <h1 class="logo-title">هاپو</h1>
                        <span class="logo-subtitle">چت‌بات هوشمند پاگ</span>
                    </div>
                </div>
            </div>

            <div class="header-center">
                <div class="stats-badge">
                    <i class="fas fa-bone"></i>
                    <span id="message-count">۰</span>
                    <span class="stats-label">استخوان</span>
                </div>
            </div>

            <div class="header-right">
                <button id="theme-toggle" class="icon-btn" title="تغییر تم" aria-label="تغییر تم">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="export-chat" class="icon-btn" title="ذخیره چت" aria-label="ذخیره چت">
                    <i class="fas fa-download"></i>
                </button>
                <button id="settings-btn" class="icon-btn" title="تنظیمات" aria-label="تنظیمات">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <main class="chat-main">
            <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="پیام‌های چت">
                <!-- Welcome message will be inserted here by JS -->
            </div>

            <!-- Typing Indicator (Hidden by default) -->
            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="typing-avatar">🐶</div>
                <div class="typing-bubbles">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-footer">
            <div class="input-container">
                <button id="attach-btn" class="input-action-btn" title="پیوست فایل" aria-label="پیوست فایل">
                    <i class="fas fa-paperclip"></i>
                </button>

                <div class="input-wrapper">
                    <textarea 
                        id="message-input" 
                        class="message-input" 
                        placeholder="پیام خود را بنویسید... 🐾"
                        rows="1"
                        maxlength="2000"
                        aria-label="پیام"
                    ></textarea>
                    <div class="input-actions">
                        <button id="voice-btn" class="input-action-btn" title="ضبط صدا" aria-label="ضبط صدا">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <button id="send-btn" class="send-btn" title="ارسال پیام" aria-label="ارسال پیام">
                    <i class="fas fa-paper-plane"></i>
                </button>

                <button id="clear-btn" class="input-action-btn danger" title="پاک کردن چت" aria-label="پاک کردن چت">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <span id="connection-status" class="connection-status online">
                        <span class="status-dot"></span>
                        <span class="status-text">آنلاین</span>
                    </span>
                </div>
                <div class="status-center">
                    <span id="last-visit" class="last-visit"></span>
                </div>
                <div class="status-right">
                    <span class="char-count">
                        <span id="char-count">۰</span>/۲۰۰۰
                    </span>
                </div>
            </div>
        </footer>

    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden" role="dialog" aria-labelledby="settings-title" aria-modal="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="settings-title" class="modal-title">⚙️ تنظیمات</h2>
                <button class="modal-close" aria-label="بستن">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label class="setting-label">
                        <i class="fas fa-moon"></i>
                        حالت تاریک
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="dark-mode-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <label class="setting-label">
                        <i class="fas fa-bell"></i>
                        صدای اعلان
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <label class="setting-label">
                        <i class="fas fa-server"></i>
                        آدرس Worker
                    </label>
                    <input type="url" id="worker-url" class="setting-input" placeholder="https://your-worker.your-subdomain.workers.dev">
                </div>

                <div class="setting-item">
                    <label class="setting-label">
                        <i class="fas fa-eraser"></i>
                        پاک کردن تاریخچه
                    </label>
                    <button id="clear-history-btn" class="btn btn-danger">
                        <i class="fas fa-trash"></i>
                        پاک کردن همه پیام‌ها
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
